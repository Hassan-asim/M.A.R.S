<script>
        // Micro-interaction for the password toggle
        const toggleBtn = document.querySelector('button[type="button"]');
        const passwordInput = document.getElementById('password');
        const iconSpan = toggleBtn.querySelector('.material-symbols-outlined');

        toggleBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                iconSpan.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                iconSpan.textContent = 'visibility';
            }
        });

        // Subtle background mouse effect
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            document.body.style.backgroundImage = `radial-gradient(circle at ${x * 100}% ${y * 100}%, rgba(203, 219, 245, 0.1) 0%, rgba(248, 250, 251, 0) 50%)`;
        });
    </script>
